<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Entregas p5.js</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 40px; max-width: 600px; margin: auto; }
        .drop-zone { border: 2px dashed #4CAF50; padding: 40px; text-align: center; border-radius: 8px; background: #1e1e1e; cursor: pointer; margin-top: 20px; }
        .drop-zone.dragover { background: #2e3b2e; }
        input, textarea { width: 100%; padding: 10px; margin-top: 10px; background: #252525; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #4CAF50; color: white; border: none; padding: 10px 20px; margin-top: 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Carpeta de preentregas p5.js</h2>
    
    <label>Nombre de usuario:</label>
    <input type="text" id="usuario" placeholder="Ej: NombreApellido">

    <div class="drop-zone" id="dropZone">
        Arrastrá aquí tu archivo de código (.js) o pegá el enlace/código abajo
    </div>

    <textarea id="codigo" rows="6" placeholder="O pega el código/enlace directamente aquí..."></textarea>
    <button id="btnGuardar">Crear Carpeta y Guardar</button>

    <p id="mensaje" style="margin-top: 15px; color: #4CAF50;"></p>

   <script>
    const dropZone = document.getElementById('dropZone');
    const txtCodigo = document.getElementById('codigo');
    const txtUsuario = document.getElementById('usuario');
    const btnGuardar = document.getElementById('btnGuardar');
    const mensaje = document.getElementById('mensaje');

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx2f2wWAl7elQk2Lq0aV_LZ8M6DxIXJpsE6jGbQDSDTJFDcH0yBY3X0qUmhcuN1htJZ/exec"; // Reemplazá con tu URL de Google Apps Script
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
    
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => { txtCodigo.value = event.target.result; };
            reader.readAsText(file);
        } else {
            const text = e.dataTransfer.getData('text');
            txtCodigo.value = text;
        }
    });

    btnGuardar.addEventListener('click', async () => {
        const usuario = txtUsuario.value.trim();
        const codigo = txtCodigo.value.trim();
        
        if (!usuario) { alert("Por favor, ingresá tu nombre."); return; }
        if (!codigo) { alert("Por favor, ingresá o arrastrá algún código."); return; }

        mensaje.textContent = "Enviando entrega...";
        btnGuardar.disabled = true;

        try {
            await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // Necesario para Google Apps Script desde páginas externas
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario: usuario, codigo: codigo })
            });

            mensaje.textContent = "¡Entrega guardada con éxito!";
            txtCodigo.value = '';
            txtUsuario.value = '';
        } catch (error) {
            mensaje.textContent = "Hubo un error al enviar.";
            console.error(error);
        } finally {
            btnGuardar.disabled = false;
        }
    });
</script>
</body>
</html>
