<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Entregas p5.js</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 40px; max-width: 600px; margin: auto; }
        .drop-zone { border: 2px dashed #4CAF50; padding: 40px; text-align: center; border-radius: 8px; background: #1e1e1e; cursor: pointer; margin-top: 20px; }
        .drop-zone.dragover { background: #2e3b2e; }
        input, textarea { width: 100%; padding: 10px; margin-top: 10px; background: #252525; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #4CAF50; color: white; border: none; padding: 10px 20px; margin-top: 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Carpeta de preentregas p5.js</h2>
    
    <label>Nombre de usuario:</label>
    <input type="text" id="usuario" placeholder="Ej: NombreApellido">

    <div class="drop-zone" id="dropZone">
        Arrastrá aquí tu archivo de código (.js) o pegá el enlace/código abajo
    </div>

    <textarea id="codigo" rows="6" placeholder="O pega el código/enlace directamente aquí..."></textarea>
    <button id="btnGuardar">Crear Carpeta y Guardar</button>

    <p id="mensaje" style="margin-top: 15px; color: #4CAF50;"></p>

   <script>
    const dropZone = document.getElementById('dropZone');
    const txtCodigo = document.getElementById('codigo');
    const txtUsuario = document.getElementById('usuario');
    const btnGuardar = document.getElementById('btnGuardar');
    const mensaje = document.getElementById('mensaje');

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx2f2wWAl7elQk2Lq0aV_LZ8M6DxIXJpsE6jGbQDSDTJFDcH0yBY3X0qUmhcuN1htJZ/exec"; // Reemplazá con tu URL de Google Apps Script
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
    
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => { txtCodigo.value = event.target.result; };
            reader.readAsText(file);
        } else {
            const text = e.dataTransfer.getData('text');
            txtCodigo.value = text;
        }
    });

    btnGuardar.addEventListener('click', async () => {
        const usuario = txtUsuario.value.trim();
        const codigo = txtCodigo.value.trim();
        
        if (!usuario) { alert("Por favor, ingresá tu nombre."); return; }
        if (!codigo) { alert("Por favor, ingresá o arrastrá algún código."); return; }

        mensaje.textContent = "Enviando entrega...";
        btnGuardar.disabled = true;

        try {
            await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // Necesario para Google Apps Script desde páginas externas
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario: usuario, codigo: codigo })
            });

            mensaje.textContent = "¡Entrega guardada con éxito!";
            txtCodigo.value = '';
            txtUsuario.value = '';
        } catch (error) {
            mensaje.textContent = "Hubo un error al enviar.";
            console.error(error);
        } finally {
            btnGuardar.disabled = false;
        }
    });

    async function cargarEntregas() {
    try {
        // Usamos la misma URL de Apps Script pero para que devuelva los datos (función doGet)
        let respuesta = await fetch(APPS_SCRIPT_URL);
        let datos = await respuesta.json();
        
        let contenedor = document.getElementById("lista-entregas");
        contenedor.innerHTML = "";

        if (datos.length === 0) {
            contenedor.innerHTML = "<p style='color: #888;'>No hay entregas todavía.</p>";
            return;
        }

       datos.forEach((entrega) => {
            let tarjeta = document.createElement("div");
            tarjeta.style.cssText = "background: #1e1e1e; padding: 15px; border-radius: 6px; border: 1px solid #333; margin-bottom: 15px;";
            
            // Si mandaron un enlace (ej: p5 editor o codepen), usamos iframe normal. 
            // Si mandaron código crudo de p5.js, armamos un visor en vivo:
            let esEnlace = entrega.codigo.startsWith("http");
            
            let contenidoVisual = "";
            if (esEnlace) {
                contenidoVisual = `<a href="${entrega.codigo}" target="_blank" style="color: #4CAF50;">Abrir enlace ↗</a>`;
            } else {
                // Creamos un HTML embebido seguro que carga p5.js y ejecuta el código del alumno en tiempo real
                let htmlContenido = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
                    </head>
                    <body style="margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh;">
                        <script>${entrega.codigo}<\/script>
                    </body>
                    </html>
                `;
                let encodedHtml = encodeURIComponent(htmlContenido);
                contenidoVisual = `<iframe src="data:text/html;charset=utf-8,${encodedHtml}" style="width:100%; height:200px; border:none; border-radius:4px; background:#000;"></iframe>`;
            }

            tarjeta.innerHTML = `
                <strong style="color: #fff; font-size: 16px;">Alumno/a: ${escapeHtml(entrega.nombre)}</strong>
                <span style="font-size: 12px; color: #888; float: right;">${entrega.fecha || ''}</span>
                <div style="margin-top: 10px;">${contenidoVisual}</div>
            `;
            contenedor.appendChild(tarjeta);
        });
    } catch (error) {
        console.error("Error al cargar entregas:", error);
    }
}

// Función auxiliar para seguridad de texto
function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Ejecutar al cargar la página
cargarEntregas();

</script>
</body>
<div style="margin-top: 40px; border-top: 1px solid #333; padding-top: 20px;">
    <h3>Entregas de los alumnos</h3>
    <div id="lista-entregas" style="display: flex; flex-direction: column; gap: 10px;">
        <p style="color: #888;">Cargando entregas...</p>
    </div>
</div>
</html>
