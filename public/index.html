<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Entregas p5.js</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 40px; max-width: 600px; margin: auto; }
        .drop-zone { border: 2px dashed #4CAF50; padding: 40px; text-align: center; border-radius: 8px; background: #1e1e1e; cursor: pointer; margin-top: 20px; }
        .drop-zone.dragover { background: #2e3b2e; }
        input, textarea { width: 100%; padding: 10px; margin-top: 10px; background: #252525; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #4CAF50; color: white; border: none; padding: 10px 20px; margin-top: 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Carpeta colaborativa p5.js</h2>
    
    <label>Nombre de usuario:</label>
    <input type="text" id="usuario" placeholder="Ej: NombreApellido">

    <div class="drop-zone" id="dropZone">
        Arrastrá aquí tu archivo de código (.js) o pegá el enlace/código abajo
    </div>

    <textarea id="codigo" rows="6" placeholder="O pega el código/enlace directamente aquí..."></textarea>
    <button id="btnGuardar">Crear Carpeta y Guardar</button>

    <p id="mensaje" style="margin-top: 15px; color: #4CAF50;"></p>

    <script>
        const dropZone = document.getElementById('dropZone');
        const txtCodigo = document.getElementById('codigo');
        const txtUsuario = document.getElementById('usuario');
        const btnGuardar = document.getElementById('btnGuardar');
        const mensaje = document.getElementById('mensaje');

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => { txtCodigo.value = event.target.result; };
                reader.readAsText(file);
            } else {
                const text = e.dataTransfer.getData('text');
                txtCodigo.value = text;
            }
        });

        btnGuardar.addEventListener('click', async () => {
            const usuario = txtUsuario.value;
            const codigo = txtCodigo.value;
            if (!codigo) { alert("Poné algún código o enlace."); return; }

            const tipo = codigo.startsWith('http') ? 'enlace' : 'codigo';

            const res = await fetch('/guardar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, codigo, tipo })
            });
            const data = await res.json();
            mensaje.textContent = data.mensaje;
            txtCodigo.value = '';
            txtUsuario.value = '';
        });
    </script>
</body>
</html>
